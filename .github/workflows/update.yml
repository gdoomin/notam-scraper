name: NOTAM_AUTO_UPDATE
on:
  schedule:
    # 한국 시간(KST) 기준: 07:00, 10:00, 13:00, 16:00
    - cron: '0 22,1,4,7 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Node.js 24 환경을 강제로 적용하여 경고 및 미래의 차단 문제를 방지합니다.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 기존 @v3에서 최신 노드 버전을 지원하는 @v4로 고쳤습니다.
      - uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Deps
        run: pip install -r requirements.txt

      - name: Run Script
        run: python main.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Upload NOTAM JSON
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: notam-latest
          path: notam-latest.json

      - name: Publish NOTAM JSON to public repo
        if: success()
        env:
          TARGET_REPO: gdoomin/notam-json
          TARGET_BRANCH: main
          TARGET_TOKEN: ${{ secrets.NOTAM_JSON_REPO_PAT }}
        run: |
          set -e
          rm -rf publish-repo
          git clone --depth 1 "https://x-access-token:${TARGET_TOKEN}@github.com/${TARGET_REPO}.git" publish-repo
          cp notam-latest.json publish-repo/notam-latest.json
          cd publish-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No snapshot changes to publish."
            exit 0
          fi
          git add notam-latest.json
          git commit -m "Update NOTAM snapshot"
          git push origin HEAD:${TARGET_BRANCH}
      - name: Upload Screenshot on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_screenshot.png
