name: NOTAM_AUTO_UPDATE

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        run: python main.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Validate NOTAM JSON
        run: |
          python - << 'EOF'
          import json
          import os

          path = "notam-latest.json"

          if not os.path.exists(path):
              raise Exception("notam-latest.json was not created")

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list):
              raise Exception("notam-latest.json is not a list")

          if len(data) < 100:
              raise Exception(f"Too few NOTAM items: {len(data)}")

          required_keys = {"lat", "lng", "content", "notam_id"}

          for i, item in enumerate(data[:10]):
              if not isinstance(item, dict):
                  raise Exception(f"Item {i} is not an object")

              missing = required_keys - set(item.keys())
              if missing:
                  raise Exception(f"Item {i} missing keys: {missing}")

          print(f"JSON validation passed: {len(data)} items")
          EOF

      - name: Upload NOTAM JSON
        uses: actions/upload-artifact@v4
        with:
          name: notam-latest
          path: notam-latest.json

      - name: Publish NOTAM JSON to public repo
        env:
          TARGET_REPO: gdoomin/notam-json
          TARGET_BRANCH: main
          TARGET_TOKEN: ${{ secrets.NOTAM_JSON_REPO_PAT }}
        run: |
          set -e

          if [ -z "${TARGET_TOKEN}" ]; then
            echo "TARGET_TOKEN is empty. Check NOTAM_JSON_REPO_PAT secret."
            exit 1
          fi

          rm -rf publish-repo

          git clone --depth 1 "https://x-access-token:${TARGET_TOKEN}@github.com/${TARGET_REPO}.git" publish-repo

          cp notam-latest.json publish-repo/notam-latest.json

          cd publish-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No snapshot changes to publish."
            exit 0
          fi

          git add notam-latest.json
          git commit -m "Update NOTAM snapshot"
          git push origin HEAD:${TARGET_BRANCH}

      - name: Upload Screenshot on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_screenshot.png
          if-no-files-found: ignore
